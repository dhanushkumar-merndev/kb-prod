project_id = "khana-banao-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
minimum_password_length = 8

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[functions.bootstrap-organization]
# Bootstrap has no user JWT yet. The Edge Function validates BOOTSTRAP_TOKEN in
# constant time and the database RPC also enforces a globally one-time lock.
verify_jwt = false

[functions.create-team-member]
verify_jwt = true

[functions.update-account-status]
verify_jwt = true

[functions.replace-role-holder]
verify_jwt = true

# Superfone authenticates webhook requests with its provider signature. JWT
# verification must be disabled at the gateway so the function can validate the
# raw signed payload before performing any write.
[functions.superfone-webhook]
verify_jwt = false

[functions.superfone-test-connection]
verify_jwt = true

[functions.superfone-import-existing-leads]
verify_jwt = true

[functions.superfone-replay-event]
verify_jwt = true

[functions.superfone-send-message]
verify_jwt = true

[functions.superfone-send-media]
verify_jwt = true

[functions.superfone-sync]
verify_jwt = true
